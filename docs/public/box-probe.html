<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>box probe</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/backend/mysql.html" style="width:1430px;height:400px"></iframe>
<script>
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3500)
  const win = document.getElementById('f').contentWindow
  const doc = document.getElementById('f').contentDocument
  const c = doc.querySelector('#content')
  const r = c.getBoundingClientRect()
  log('#content 盒子: left=' + Math.round(r.left) + ' right=' + Math.round(r.right) + ' width=' + Math.round(r.width))
  const aside = doc.querySelector('aside.vp-sidebar, aside.sidebar')
  const ar = aside.getBoundingClientRect()
  log('侧边栏: left=' + Math.round(ar.left) + ' right=' + Math.round(ar.right) + ' width=' + Math.round(ar.width))
  const main = doc.querySelector('.vp-page')
  log('vp-page: left=' + Math.round(main.getBoundingClientRect().left) + ' width=' + Math.round(main.getBoundingClientRect().width))
  log('视口宽: ' + win.innerWidth)
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
