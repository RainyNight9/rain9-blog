<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fix test 2</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/ai-jobs/" style="width:1100px;height:400px"></iframe>
<script>
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3200)
  const win = document.getElementById('f').contentWindow
  const doc = document.getElementById('f').contentDocument
  doc.addEventListener('click', (e) => {
    const a = e.target.closest('aside.sidebar a[href*="#"]')
    if (!a) return
    const url = new URL(a.href, win.location.origin)
    if (url.pathname !== win.location.pathname) return
    e.preventDefault(); e.stopPropagation()
    const el = doc.getElementById(decodeURIComponent(url.hash.slice(1)))
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
    win.history.replaceState(null, '', url.hash)
  }, true)
  const snap = (tag) => {
    const h1 = doc.querySelector('.theme-default-content h1')
    const hs = [...doc.querySelectorAll('aside.sidebar .sidebar-heading')].map(h => h.textContent.trim())
    log(tag + ' | url=' + win.location.pathname + ' | 正文h1=' + (h1 ? h1.textContent.slice(0, 10) : '无') + ' | 侧边栏=' + (hs.length ? hs.slice(0, 2).join('/') : '(空)'))
  }
  const anchor = [...doc.querySelectorAll('aside.sidebar a')].find(x => x.getAttribute('href').includes('#_4-'))
  anchor.click(); await wait(1500)
  snap('S1 点锚点后')
  for (const t of ['前端', '后端', 'AI 岗位']) {
    const a = [...doc.querySelectorAll('.navbar-items a')].find(x => x.textContent.trim() === t)
    a.click(); await wait(4000)
    snap('S →' + t)
  }
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
