<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>stress 2</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/ai-jobs/" style="width:1100px;height:400px"></iframe>
<script>
const errors = []
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3200)
  let reloads = 0
  const win0 = document.getElementById('f').contentWindow
  win0.__alive = 1
  const win = () => document.getElementById('f').contentWindow
  const doc = () => document.getElementById('f').contentDocument
  win().addEventListener('error', (e) => errors.push('E: ' + e.message.slice(0, 70)))
  win().addEventListener('unhandledrejection', (e) => errors.push('R: ' + String(e.reason).slice(0, 70)))
  const snap = (tag) => {
    const w = win(), d = doc()
    if (w.__alive !== 1) { reloads++; w.__alive = 1 }
    const h1 = d.querySelector('.theme-default-content h1')
    const aside = d.querySelector('aside.sidebar')
    const hs = aside ? [...aside.querySelectorAll('.sidebar-heading')].map(x => x.textContent.trim()) : []
    log(tag + ' | h1=' + (h1 ? h1.textContent.slice(0, 12) : '无') + ' | 侧栏=' + (hs.length ? hs[0].slice(0, 12) : '(空)') + ' | 累计刷新=' + reloads)
  }
  const nav = async (text) => {
    const a = [...doc().querySelectorAll('.navbar-items a, .navbar-dropdown a')].find(x => x.textContent.trim() === text)
    if (!a) { log('未找到 ' + text); return }
    a.click(); await new Promise(r => setTimeout(r, 2200))
    snap('→' + text)
  }
  snap('S0 起始')
  const flow = ['前端', '后端', 'AI 岗位', '桌面端', '后端', 'WebGL', 'AI 岗位', 'Web3', '前端', 'AI 目录', '后端', '算法与面试', '前端', '后端', 'AI 岗位']
  for (const t of flow) { await nav(t) }
  log('错误数: ' + errors.length)
  errors.slice(0, 3).forEach((e, i) => log('E' + i + ': ' + e))
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
