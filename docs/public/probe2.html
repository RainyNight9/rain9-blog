<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe2</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/backend/mysql.html" style="width:1100px;height:400px"></iframe>
<script>
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3500)
  const win = document.getElementById('f').contentWindow
  const doc = document.getElementById('f').contentDocument
  const h2 = doc.querySelector('#content h2')
  if (!h2) { log('no h2'); return }
  const cs = win.getComputedStyle(h2)
  const bf = win.getComputedStyle(h2, '::before')
  const r = h2.getBoundingClientRect()
  log('h2.position=' + cs.position + ' | paddingLeft=' + cs.paddingLeft + ' | paddingTop=' + cs.paddingTop + ' | marginTop=' + cs.marginTop)
  log('h2.fontSize=' + cs.fontSize + ' | lineHeight=' + cs.lineHeight + ' | box: left=' + Math.round(r.left) + ' top=' + Math.round(r.top) + ' w=' + Math.round(r.width) + ' h=' + Math.round(r.height))
  log('::before: top=' + bf.top + ' left=' + bf.left + ' w=' + bf.width + ' h=' + bf.height)
  const content = doc.querySelector('#content')
  log('content.maxWidth=' + win.getComputedStyle(content).maxWidth + ' | content.paddingLeft=' + win.getComputedStyle(content).paddingLeft)
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
