<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>style probe</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/2026/%E6%95%B0%E6%8D%AE%E5%88%86%E6%9E%90%20AI%20Agent/1.%20%E5%AF%BC%E8%AE%BA_%20Al%20Agent%20%E4%B8%8E%E7%8E%B0%E4%BB%A3%E5%8C%96%E6%95%B0%E6%8D%AE%E5%88%86%E6%9E%90%E6%9E%B6%E6%9E%84/1.1.%20%E7%90%86%E8%A7%A3AI%20Agent%E4%B8%8E%E8%87%AA%E5%8A%A8%E5%8C%96%E6%95%B0%E6%8D%AE%E5%88%86%E6%9E%90.html" style="width:1100px;height:400px"></iframe>
<script>
const log = (m) => { try { document.getElementById('log').innerHTML += '<br>' + m } catch(e) {} }
window.runTest = async () => {
  try {
    const wait = (ms) => new Promise(r => setTimeout(r, ms))
    log('runTest 开始')
    await wait(4000)
    const doc = document.getElementById('f').contentDocument
    log('doc: ' + (doc ? 'ok, url=' + doc.location.pathname.slice(0, 30) : 'null'))
    const h2 = doc.querySelector('.theme-default-content h2')
    log('h2: ' + (h2 ? h2.textContent.slice(0, 14) : 'MISSING'))
    if (!h2) { log('DONE'); return }
    const win = document.getElementById('f').contentWindow
    const cs = win.getComputedStyle(h2)
    const before = win.getComputedStyle(h2, '::before')
    log('h2.position=' + cs.position + ' paddingLeft=' + cs.paddingLeft + ' marginTop=' + cs.marginTop)
    log('::before content=' + before.content + ' position=' + before.position + ' top=' + before.top + ' left=' + before.left + ' w=' + before.width + ' h=' + before.height)
    const content = doc.querySelector('.theme-default-content')
    log('content.transform=' + win.getComputedStyle(content).transform)
    log('DONE')
  } catch (e) { log('ERROR: ' + e.message) }
}
setTimeout(runTest, 1500)
</script></body></html>
