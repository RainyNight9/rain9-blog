<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hash test 3</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/ai-jobs/" style="width:1100px;height:400px"></iframe>
<script>
const errors = []
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3200)
  const win = document.getElementById('f').contentWindow
  const doc = document.getElementById('f').contentDocument
  // 捕获 iframe 内所有错误
  win.addEventListener('error', (e) => errors.push('ERROR: ' + e.message + ' @ ' + (e.filename || '') + ':' + e.lineno))
  win.addEventListener('unhandledrejection', (e) => errors.push('REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack.split('\n').slice(0, 3).join(' ⏎ ') : e.reason)))
  const origErr = win.console.error.bind(win.console)
  win.console.error = (...a) => { errors.push('console.error: ' + a.map(x => String(x && x.stack ? x.stack.split('\n').slice(0, 2).join(' ⏎ ') : x)).join(' ').slice(0, 300)); origErr(...a) }
  log('错误监听已挂载')
  // 触发复现
  const anchor = [...doc.querySelectorAll('aside.sidebar a')].find(x => x.getAttribute('href').includes('#_4-'))
  anchor.click(); await wait(2000)
  const a2 = [...doc.querySelectorAll('.navbar-items a')].find(x => x.textContent.trim() === '前端')
  a2.click(); await wait(2500)
  const h1 = doc.querySelector('.theme-default-content h1')
  log('切到前端后 h1=' + (h1 ? h1.textContent.slice(0, 12) : '无'))
  log('捕获错误数: ' + errors.length)
  errors.slice(0, 6).forEach((e, i) => log('E' + i + ': ' + e.slice(0, 260)))
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
