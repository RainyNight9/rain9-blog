<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>stress</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/ai-jobs/" style="width:1100px;height:400px"></iframe>
<script>
const errors = []
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3200)
  const win = document.getElementById('f').contentWindow
  const doc = document.getElementById('f').contentDocument
  win.addEventListener('error', (e) => errors.push('E: ' + e.message.slice(0, 80)))
  win.addEventListener('unhandledrejection', (e) => errors.push('R: ' + String(e.reason).slice(0, 80)))
  const snap = (tag) => {
    const h1 = doc.querySelector('.theme-default-content h1')
    const aside = doc.querySelector('aside.sidebar')
    const hs = aside ? [...aside.querySelectorAll('.sidebar-heading')].map(x => x.textContent.trim()) : []
    const okSidebar = hs.length ? hs[0] : '(空)'
    log(tag + ' | 正文h1=' + (h1 ? h1.textContent.slice(0, 12) : '无') + ' | 侧边栏首组=' + okSidebar.slice(0, 14))
  }
  const nav = async (text, ms) => {
    const a = [...doc.querySelectorAll('.navbar-items a, .navbar-dropdown a')].find(x => x.textContent.trim() === text)
    if (!a) { log('未找到 ' + text); return }
    a.click(); await new Promise(r => setTimeout(r, ms || 2000))
  }
  snap('S0 起始')
  // 15 次连续跨分区导航
  const flow = ['前端', '后端', 'AI 岗位', '桌面端', '后端', 'WebGL', 'AI 岗位', 'Web3', '前端', 'AI 目录', '后端', '算法与面试', '前端', '后端', 'AI 岗位']
  for (const t of flow) { await nav(t); snap('→' + t) }
  // 页内锚点点击（正文里的 # 链接）
  const anchor = [...doc.querySelectorAll('.theme-default-content a')].find(x => x.getAttribute('href') && x.getAttribute('href').startsWith('#'))
  if (anchor) { anchor.click(); await wait(2000); snap('→页内锚点') } else log('本页无页内锚点链接')
  log('错误数: ' + errors.length)
  errors.slice(0, 4).forEach((e, i) => log('E' + i + ': ' + e))
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
