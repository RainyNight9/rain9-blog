<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hash test 2</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/ai-jobs/" style="width:1100px;height:400px"></iframe>
<script>
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
const probe = (tag) => {
  const doc = document.getElementById('f').contentDocument
  const win = document.getElementById('f').contentWindow
  const content = doc.querySelector('.theme-default-content')
  const h1 = content && content.querySelector('h1')
  const aside = doc.querySelector('aside.sidebar')
  const hs = aside ? [...aside.querySelectorAll('.sidebar-heading')].map(h => h.textContent.trim()) : []
  log(tag + ' | url=' + win.location.pathname + win.location.hash.slice(0,12)
    + ' | 正文h1=' + (h1 ? h1.textContent.slice(0, 16) : '无')
    + ' | 侧边栏=' + (hs.length ? hs.slice(0, 2).join('/') : '(空)'))
}
const clickNav = async (text) => {
  const doc = document.getElementById('f').contentDocument
  const a = [...doc.querySelectorAll('.navbar-items a')].find(x => x.textContent.trim() === text)
  a.click(); await new Promise(r => setTimeout(r, 2500))
}
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3000)
  probe('S1 起始')
  // 点击页内锚点（侧边栏里的 h2 子链接）
  const doc0 = document.getElementById('f').contentDocument
  const anchor = [...doc0.querySelectorAll('aside.sidebar a')].find(x => x.getAttribute('href').includes('#_4-'))
  anchor.click(); await wait(2000)
  probe('S2 点锚点后')
  await clickNav('前端'); probe('S3 →前端')
  await clickNav('后端'); probe('S4 →后端')
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
