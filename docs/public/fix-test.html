<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fix test</title></head>
<body style="font-family:monospace;font-size:12px">
<div id="log">start</div>
<iframe id="f" src="/blogs/ai-jobs/" style="width:1100px;height:400px"></iframe>
<script>
const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m }
window.runTest = async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms))
  await wait(3200)
  const win = document.getElementById('f').contentWindow
  const doc = document.getElementById('f').contentDocument
  // ── 修复方案：拦截侧边栏锚点子链接，原生滚动代替路由 hash 导航 ──
  doc.addEventListener('click', (e) => {
    const a = e.target.closest('aside.sidebar a[href*="#"]')
    if (!a) return
    const url = new URL(a.href, win.location.origin)
    if (url.pathname !== win.location.pathname) return
    e.preventDefault()
    e.stopPropagation()
    const el = doc.getElementById(decodeURIComponent(url.hash.slice(1)))
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
    win.history.replaceState(null, '', url.hash)
  }, true)
  log('拦截器已挂载')
  // ── 复现路径 ──
  const anchor = [...doc.querySelectorAll('aside.sidebar a')].find(x => x.getAttribute('href').includes('#_4-'))
  anchor.click(); await wait(2000)
  log('S1 点锚点后 hash=' + win.location.hash.slice(0, 14))
  const a2 = [...doc.querySelectorAll('.navbar-items a')].find(x => x.textContent.trim() === '前端')
  a2.click(); await wait(2500)
  const h1 = doc.querySelector('.theme-default-content h1')
  const hs = [...doc.querySelectorAll('aside.sidebar .sidebar-heading')].map(h => h.textContent.trim())
  log('S2 →前端 | 正文h1=' + (h1 ? h1.textContent.slice(0, 10) : '无') + ' | 侧边栏=' + (hs.length ? hs.slice(0, 2).join('/') : '(空)'))
  const a3 = [...doc.querySelectorAll('.navbar-items a')].find(x => x.textContent.trim() === '后端')
  a3.click(); await wait(2500)
  const h1b = doc.querySelector('.theme-default-content h1')
  const hs2 = [...doc.querySelectorAll('aside.sidebar .sidebar-heading')].map(h => h.textContent.trim())
  log('S3 →后端 | 正文h1=' + (h1b ? h1b.textContent.slice(0, 10) : '无') + ' | 侧边栏=' + (hs2.length ? hs2.slice(0, 2).join('/') : '(空)'))
  log('DONE')
}
setTimeout(runTest, 1500)
</script></body></html>
